# spatialjepa-msi: SpatialMETA-backbone training and encoding (PyTorch 2.2.2, CUDA 12.1, PyG 2.6.1)
# The packages the scripts run in this environment import, and everything those require, pinned to the
# versions that produced the manuscript results. Exact lists: envs/lock/spatialjepa-msi.conda-explicit.txt,
# envs/lock/spatialjepa-msi.pip-freeze.txt.
# envs/install.sh then adds spatialmeta without dependency resolution (envs/no-deps.txt).
name: spatialjepa-msi
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9.23
  - pip
  - setuptools=59.5.0  # the version that ran; newer ones lack pkg_resources, which umap-learn imports
