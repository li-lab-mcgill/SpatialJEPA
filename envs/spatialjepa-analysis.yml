# spatialjepa-analysis: RNA-ATAC (MultiGATE backbone), analyses and figures
# The packages the scripts run in this environment import, and everything those require, pinned to the
# versions that produced the manuscript results. Exact lists: envs/lock/spatialjepa-analysis.conda-explicit.txt,
# envs/lock/spatialjepa-analysis.pip-freeze.txt.
# Left to pip (cryptography, fsspec, protobuf): they ran next to versions their dependents exclude.
# envs/install.sh then adds chex, leidenalg, mvlearn without dependency resolution (envs/no-deps.txt).
name: spatialjepa-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.14
  - pip
  - bedtools  # pybedtools (gene-peak graph, motif inputs)
  # R for SCTransform (rna_msi/sctransform_rna.py via rpy2) and the Seurat export
  - r-base=4.3.3
  - r-seurat=5.1.0
  - r-seuratobject=5.2.0
  - r-sctransform=0.4.2
  - r-matrix=1.6_5
  - bioconductor-scater=1.30.1
  - bioconductor-glmgampoi=1.14.0
  - setuptools=80.9.0  # the version that ran; newer ones lack pkg_resources, which umap-learn imports
  - rpy2=3.5.11
  - ncls=0.0.70
  - sorted_nearest=0.0.41
  - jax=0.4.27
  - jaxlib=0.4.23=cpu_py310h180ec9f_2  # pip sees 0.4.23.dev20240522
