# spatialjepa-multigrate: Multigrate baseline (multigrate 0.0.2, scvi-tools 1.0.4)
# The packages the scripts run in this environment import, and everything those require, pinned to the
# versions that produced the manuscript results. Exact lists: envs/lock/spatialjepa-multigrate.conda-explicit.txt,
# envs/lock/spatialjepa-multigrate.pip-freeze.txt.
