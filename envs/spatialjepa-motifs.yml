# spatialjepa-motifs: motif scans (MOODS, pyjaspar)
# The packages the scripts run in this environment import, and everything those require, pinned to the
# versions that produced the manuscript results. Exact lists: envs/lock/spatialjepa-motifs.conda-explicit.txt,
# envs/lock/spatialjepa-motifs.pip-freeze.txt.
# envs/install.sh then adds pybedtools without dependency resolution (envs/no-deps.txt).
name: spatialjepa-motifs
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.8
  - pip
  - bedtools
  - setuptools=78.1.1  # the version that ran; newer ones lack pkg_resources, which umap-learn imports
  - pip:
    - anyio==4.11.0
    - appdirs==1.4.4
    - biopython==1.85
    - biothings_client==0.4.1
    - certifi==2024.2.2
    - charset-normalizer==3.3.2
    - click==8.1.7
    - colorama==0.4.6
    - diskcache==5.6.3
    - filelock==3.13.1
    - genomepy==0.16.3
    - h11==0.16.0
    - h5py==3.10.0
    - httpcore==1.0.9
    - httpx==0.28.1
    - idna==3.6
    - loguru==0.7.3
    - MOODS-python==1.9.4.1
    - mygene==3.2.2
    - mysql-connector-python==8.4.0
    - numpy==1.26.4
    - packaging==25.0
    - pandas==2.3.3
    - patsy==0.5.6
    - pyfaidx==0.9.0.3
    - pyjaspar==4.0.0
    - pysam==0.22.0
    - python-dateutil==2.9.0.post0
    - pytz==2024.1
    - PyYAML==6.0.1
    - requests==2.31.0
    - scipy==1.12.0
    - six==1.17.0
    - sniffio==1.3.1
    - statsmodels==0.14.5
    - tqdm==4.66.2
    - typing_extensions==4.15.0
    - tzdata==2025.2
    - urllib3==2.2.1
