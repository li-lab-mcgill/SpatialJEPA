# spatialjepa-scvi: MultiVI baseline and three RNA-ATAC figure scripts (scvi-tools 1.3.3)
# The packages the scripts run in this environment import, and everything those require, pinned to the
# versions that produced the manuscript results. Exact lists: envs/lock/spatialjepa-scvi.conda-explicit.txt,
# envs/lock/spatialjepa-scvi.pip-freeze.txt.
# Left to pip (fsspec, packaging): they ran next to versions their dependents exclude.
name: spatialjepa-scvi
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.11
  - pip
  - setuptools=75.1.0  # the version that ran; newer ones lack pkg_resources, which umap-learn imports
