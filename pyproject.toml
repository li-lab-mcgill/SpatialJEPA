[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialjepa"
version = "1.0.0"
description = "SpatialJEPA: graph-context distillation that transfers tissue context from spatial multiomics to non-spatial single-cell data"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT AND Apache-2.0" }   # MIT; MultiGATE/ keeps its upstream Apache-2.0 (see NOTICE)
authors = [
    { name = "Dylan Mann-Krzisnik" },
    { name = "Yue Li" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
# The exact environments used for the manuscript are pinned in envs/ (one per stage); installing this
# project only makes the two packages importable. Scripts also find them without installation.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/li-lab-mcgill/SpatialJEPA"

[tool.setuptools.packages.find]
include = ["MultiGATE", "MultiGATE.*", "spatialjepa", "spatialjepa.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
